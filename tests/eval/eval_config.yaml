metrics_to_run:
  - framl_11_section_audit
  - custom_response_quality
  - agent_turn_count

custom_metrics:
  # Local LLM-as-judge scoring investigative accuracy and evidence citation
  - name: custom_response_quality
    custom_function_file: response_quality.py

  # Deterministic compliance auditor validating 11-section structure, citations, and disclaimers
  - name: framl_11_section_audit
    custom_function_file: framl_metric.py

  # Turn count metric
  - name: agent_turn_count
    custom_function: |
      def evaluate(instance):
          turns = (instance.get("agent_data") or {}).get("turns", [])
          return {'score': len(turns)}


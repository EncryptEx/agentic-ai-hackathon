<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Crime Analyst Platform</title>
    <style>
        :root {
            --bg-color: #05070c;
            --text-color: #cfe0ff;
            --tab-bg: #101726;
            --tab-active-bg: #1e2b45;
            --tab-hover-bg: #172033;
            --border-color: #24324d;
            --accent-color: #3b82f6;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            height: 60px;
            background-color: var(--tab-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            margin: 0;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .tabs {
            display: flex;
            height: 100%;
        }

        .tab {
            padding: 0 20px;
            display: flex;
            align-items: center;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.2s;
            color: rgba(207, 224, 255, 0.7);
        }

        .tab:hover {
            background-color: var(--tab-hover-bg);
            color: var(--text-color);
        }

        .tab.active {
            background-color: var(--tab-active-bg);
            border-bottom-color: var(--accent-color);
            color: var(--text-color);
        }

        .content {
            flex: 1;
            position: relative;
        }

        .iframe-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
        }

        .iframe-container.active {
            display: block;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Sentinel FC Platform</h1>
        <div class="tabs">
            <div class="tab active" data-target="sentinel-tab">Alerts Dashboard (Sentinel)</div>
            <div class="tab" data-target="metrics-tab">Metrics & Visualizations</div>
            <div class="tab" data-target="realtime-tab">Realtime Stream</div>
            <div class="tab" data-target="investigator-tab">Investigator</div>
        </div>
    </div>
    
    <div class="content">
        <div id="sentinel-tab" class="iframe-container active">
            <iframe src="/sentinel" title="Sentinel Alerts"></iframe>
        </div>
        <div id="metrics-tab" class="iframe-container">
            <iframe src="/visualizer" title="Metrics & Visualizations"></iframe>
        </div>
        <div id="realtime-tab" class="iframe-container">
            <iframe src="/realtime" title="Realtime Stream"></iframe>
        </div>
        <div id="investigator-tab" class="iframe-container">
            <iframe src="/investigator" title="EvidenceTrail Investigator"></iframe>
        </div>
    </div>

    <script>
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                // Remove active class from all tabs and containers
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.iframe-container').forEach(c => c.classList.remove('active'));
                
                // Add active class to clicked tab and corresponding container
                tab.classList.add('active');
                const targetId = tab.getAttribute('data-target');
                document.getElementById(targetId).classList.add('active');
            });
        });
    </script>
</body>
</html>

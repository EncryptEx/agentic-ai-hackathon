<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EvidenceTrail Investigator</title>
    <style>
:root {
    --bg-primary: #090d16;
    --bg-secondary: #101726;
    --bg-card: #172033;
    --bg-card-hover: #1e2b45;
    --border-color: #24324d;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --text-muted: #64748b;
    --accent-blue: #3b82f6;
    --accent-blue-hover: #2563eb;
    --tier-low: #10b981;
    --tier-low-bg: rgba(16, 185, 129, 0.14);
    --tier-med: #f59e0b;
    --tier-med-bg: rgba(245, 158, 11, 0.14);
    --tier-high: #f97316;
    --tier-high-bg: rgba(249, 115, 22, 0.14);
    --tier-crit: #ef4444;
    --tier-crit-bg: rgba(239, 68, 68, 0.16);
    --fraud-magenta: #d946ef;
    --fraud-magenta-bg: rgba(217, 70, 239, 0.15);
}
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
body {
    background-color: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    display: block;
}
.btn-primary {
    background-color: var(--accent-blue);
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
}
.btn-primary:hover {
    background-color: var(--accent-blue-hover);
}
.page-btn {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    padding: 5px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
}
.page-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}
/* ---------- EvidenceTrail Investigator ---------- */
.inv-banner { background: var(--tier-med-bg); border: 1px solid var(--tier-med); color: var(--tier-med); border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; }
.inv-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 16px; }
.inv-controls select, #inv-reps { background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: 6px; padding: 9px 12px; font-size: 13px; }
.inv-label { font-size: 12px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: .04em; }
.inv-start { padding: 9px 18px; }
.inv-start:disabled, .inv-controls .page-btn:disabled, .inv-card .page-btn:disabled { opacity: .5; cursor: not-allowed; }
.inv-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
.inv-grid { display: grid; grid-template-columns: minmax(260px, 1fr) minmax(300px, 1.4fr) minmax(280px, 1fr); gap: 16px; align-items: start; }
.inv-quality { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; margin-top: 16px; align-items: start; }
.inv-col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.inv-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 10px; padding: 16px; min-width: 0; }
.inv-card h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--accent-blue); margin-bottom: 12px; }
.inv-card h4 { font-size: 12px; color: var(--text-secondary); margin: 14px 0 6px; text-transform: uppercase; }
.inv-muted { color: var(--text-secondary); font-size: 12px; line-height: 1.5; margin-top: 4px; }
.inv-amount { font-size: 26px; font-weight: 700; margin-bottom: 10px; }
.inv-kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; font-size: 12px; margin: 8px 0; }
.inv-kv dt { color: var(--text-secondary); }
.inv-kv dd { word-break: break-word; }
.inv-tag { font-size: 11px; padding: 3px 8px; border-radius: 999px; background: var(--bg-secondary); border: 1px solid var(--border-color); color: var(--text-secondary); }
.inv-tag.fresh { color: var(--tier-low); border-color: var(--tier-low); background: var(--tier-low-bg); }
.inv-tag.recorded { color: var(--accent-blue); border-color: var(--accent-blue); }
.inv-tag.bad, .inv-tag.state-failed { color: var(--tier-crit); border-color: var(--tier-crit); background: var(--tier-crit-bg); }
.inv-error { color: var(--tier-crit); background: var(--tier-crit-bg); border: 1px solid var(--tier-crit); border-radius: 6px; padding: 8px 10px; font-size: 12px; margin-top: 8px; }
.inv-warn { color: var(--tier-med); background: var(--tier-med-bg); border: 1px solid var(--tier-med); border-radius: 6px; padding: 8px 10px; font-size: 12px; margin-top: 8px; }
.inv-decision { border-radius: 8px; padding: 12px 14px; border: 1px solid var(--border-color); }
.inv-decision-action { font-size: 20px; font-weight: 700; }
.inv-decision.act-ALLOW { background: var(--tier-low-bg); border-color: var(--tier-low); }
.inv-decision.act-CONTEXT_CHECK { background: var(--tier-med-bg); border-color: var(--tier-med); }
.inv-decision.act-REVIEW { background: var(--tier-crit-bg); border-color: var(--tier-crit); }
.inv-explain { font-size: 13px; margin-top: 10px; line-height: 1.5; }
.inv-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: center; }
.inv-question { font-size: 13px; font-weight: 600; margin: 12px 0 4px; }
.inv-signal { font-size: 12px; margin: 6px 0; }
.inv-timeline { list-style: none; display: flex; flex-direction: column; gap: 10px; }
.inv-step { border-left: 3px solid var(--accent-blue); padding: 4px 0 4px 12px; }
.inv-step.err { border-left-color: var(--tier-crit); }
.inv-step-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; }
.inv-step-n { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 50%; width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; }
.inv-chips { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-top: 6px; }
.inv-chip { font-size: 11px; padding: 2px 8px; border-radius: 4px; border: 1px solid var(--border-color); background: var(--bg-secondary); color: var(--text-primary); cursor: pointer; }
.inv-chip:hover, .inv-chip.active { border-color: var(--accent-blue); background: rgba(59, 130, 246, .18); }
.inv-chip.missing { border-color: var(--tier-crit); color: var(--tier-crit); }
.inv-chip:focus-visible, .inv-claim:focus-visible, .inv-node:focus-visible { outline: 2px solid var(--accent-blue); outline-offset: 2px; }
.inv-details { margin-top: 8px; font-size: 12px; }
.inv-details summary { cursor: pointer; color: var(--text-secondary); }
.inv-pre { background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 6px; padding: 8px; font-size: 11px; overflow: auto; max-height: 260px; white-space: pre-wrap; word-break: break-word; margin-top: 6px; }
.inv-claim { display: block; width: 100%; text-align: left; background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: 6px; padding: 10px; margin-bottom: 8px; font-size: 13px; cursor: pointer; }
.inv-claim:hover, .inv-claim.active { border-color: var(--accent-blue); }
.inv-svg { width: 100%; height: auto; background: var(--bg-primary); border-radius: 6px; border: 1px solid var(--border-color); }
.inv-edge { stroke: var(--text-muted); stroke-width: 1.5; }
.inv-edge-label { fill: var(--text-secondary); font-size: 8px; }
.inv-node circle { fill: var(--bg-card-hover); stroke: var(--accent-blue); stroke-width: 2; }
.inv-node.flagged circle { stroke: var(--tier-crit); fill: var(--tier-crit-bg); }
.inv-node.root circle { fill: rgba(59, 130, 246, .3); }
.inv-node text { fill: var(--text-primary); font-size: 8px; }
.inv-evidence-item { margin-bottom: 12px; }
.inv-metric { margin-bottom: 12px; }
.inv-score { margin-left: 8px; font-weight: 700; }
.inv-score.pass { color: var(--tier-low); }
.inv-score.fail { color: var(--tier-med); }
@media (max-width: 1100px) { .inv-grid { grid-template-columns: 1fr; } .inv-badges { margin-left: 0; } }
.inv-table-wrap { overflow-x: auto; margin: 8px 0; }
.inv-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.inv-table th, .inv-table td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border-color); vertical-align: top; }
.inv-table th { color: var(--text-secondary); font-weight: 600; }
.inv-actions select { background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: 6px; padding: 7px 10px; font-size: 12px; }

/* ---------- Alerts ---------- */
.inv-alerts { margin-top: 16px; }
.inv-alert-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.inv-alert-bar h3 { margin-bottom: 0; }
.inv-alert-bar select { background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: 6px; padding: 6px 10px; font-size: 12px; }
.inv-alert { border-radius: 8px; border: 1px solid var(--border-color); padding: 10px 12px; margin-top: 10px; font-size: 13px; background: var(--bg-secondary); }
.inv-alert.none { color: var(--text-secondary); font-size: 12px; }
.inv-alert-head { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.inv-alert.sev-high, .inv-alert-row.sev-high { border-left: 4px solid var(--tier-crit); }
.inv-alert.sev-medium, .inv-alert-row.sev-medium { border-left: 4px solid var(--tier-med); }
.inv-alert.sev-low, .inv-alert-row.sev-low { border-left: 4px solid var(--accent-blue); }
.inv-alert-list { list-style: none; display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.inv-alert-row { background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px 12px; font-size: 13px; }

/* Quick-Pick Typology Presets */
.quick-pick-panel {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 10px;
    padding: 18px;
    margin-bottom: 20px;
}

.quick-pick-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
}

.chip-group-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin: 10px 0 6px 0;
}

.chip-container {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.typology-chip {
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    color: var(--text-secondary);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    gap: 6px;
}

.typology-chip:hover {
    border-color: var(--accent-blue);
    color: var(--text-primary);
    background: rgba(37,99,235,0.12);
}

.typology-chip.active {
    background: var(--accent-blue);
    color: white;
    border-color: var(--accent-blue);
    font-weight: 600;
    box-shadow: 0 2px 8px rgba(37,99,235,0.35);
}

.typology-chip.fraud.active {
    background: linear-gradient(135deg, #d946ef, #ec4899);
    border-color: #d946ef;
    box-shadow: 0 2px 8px rgba(217,70,239,0.35);
}

.typology-chip.aml.active {
    background: linear-gradient(135deg, #2563eb, #3b82f6);
    border-color: #2563eb;
    box-shadow: 0 2px 8px rgba(37,99,235,0.35);
}

.preset-banner {
    background: linear-gradient(90deg, rgba(37,99,235,0.12) 0%, rgba(217,70,239,0.12) 100%);
    border: 1px solid rgba(37,99,235,0.3);
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.btn-pick-test {
    background: rgba(37,99,235,0.15);
    color: var(--accent-blue);
    border: 1px solid var(--accent-blue);
    padding: 5px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
}

.btn-pick-test:hover {
    background: var(--accent-blue);
    color: white;
}


/* ---------- Agent team ---------- */
.inv-tag.agent-orchestrator { color: var(--accent-blue); border-color: var(--accent-blue); }
.inv-tag.agent-behavior_device { color: var(--tier-low); border-color: var(--tier-low); }
.inv-tag.agent-recipient_network { color: var(--tier-med); border-color: var(--tier-med); }
.inv-tag.agent-risk_judge { color: var(--fraud-magenta); border-color: var(--fraud-magenta); }

/* ---------- Hand-off ---------- */
.inv-input { background: var(--bg-primary); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: 6px; padding: 7px 10px; font-size: 12px; min-width: 220px; }

/* ---------- Seed data ---------- */
.inv-controls #inv-source { background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: 6px; padding: 9px 12px; font-size: 13px; max-width: 220px; }
#inv-case { max-width: 420px; }
.inv-link { background: none; border: none; color: var(--accent-blue); cursor: pointer; font-size: 12px; text-decoration: underline; padding: 0; }

/* ---------- Plain-language evidence and trace ---------- */
.inv-headline { font-size: 13px; line-height: 1.5; margin: 8px 0 4px; }
.inv-facts { margin: 4px 0 8px 18px; font-size: 12px; line-height: 1.6; color: var(--text-primary); }
.inv-why, .inv-found { font-size: 12px; line-height: 1.5; margin-top: 4px; }
.inv-why { color: var(--text-secondary); }
.inv-found { color: var(--text-primary); }
.inv-why-label { font-weight: 600; color: var(--text-secondary); }


.inv-page { max-width: 1500px; margin: 0 auto; padding: 24px 28px 48px; }
.inv-page h1 { font-size: 18px; margin-bottom: 4px; }
.inv-page .lede { color: var(--text-secondary); font-size: 13px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <main class="inv-page">
        <h1>EvidenceTrail Investigator</h1>
        <p class="lede">A team of agents investigates a suspicious synthetic transfer with registered tools. Every result is stored as evidence, and a deterministic policy decides the simulated outcome. All data is synthetic.</p>
        <div id="inv-root"></div>
    </main>
    <script src="/investigator.js"></script>
</body>
</html>

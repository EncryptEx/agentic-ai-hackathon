<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Crime Analyst Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #050505;
            --bg-nav: rgba(10, 10, 10, 0.65);
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --border-subtle: rgba(255, 255, 255, 0.08);
            --accent-brand: #3b82f6;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            height: 64px;
            background-color: var(--bg-nav);
            border-bottom: 1px solid var(--border-subtle);
            backdrop-filter: blur(12px);
            z-index: 10;
        }

        .header h1 {
            margin: 0; font-size: 1.15rem; font-weight: 600; letter-spacing: -0.02em;
            display: flex; align-items: center; gap: 8px;
        }
        
        .header h1::before {
            content: ''; display: block; width: 18px; height: 18px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 4px;
        }

        .tabs { display: flex; height: 100%; gap: 8px; align-items: center; }

        .tab {
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 6px;
            font-size: 0.9rem; font-weight: 500;
            transition: all 0.2s ease;
            color: var(--text-muted);
            border: 1px solid transparent;
        }

        .tab:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
        }

        .tab.active {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-subtle);
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .content { flex: 1; position: relative; }

        .iframe-container {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .iframe-container.active {
            opacity: 1; pointer-events: auto;
        }

        iframe { width: 100%; height: 100%; border: none; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Sentinel AI &middot; FC Platform</h1>
        <div class="tabs">
            <div class="tab active" data-target="sentinel-tab">Alerts Dashboard</div>
            <div class="tab" data-target="metrics-tab">Metrics</div>
            <div class="tab" data-target="realtime-tab">Realtime Stream</div>
            <div class="tab" data-target="investigator-tab">Investigator</div>
        </div>
    </div>
    
    <div class="content">
        <div id="sentinel-tab" class="iframe-container active">
            <iframe src="/sentinel" title="Sentinel Alerts"></iframe>
        </div>
        <div id="metrics-tab" class="iframe-container">
            <iframe src="/visualizer" title="Metrics & Visualizations"></iframe>
        </div>
        <div id="realtime-tab" class="iframe-container">
            <iframe src="/realtime" title="Realtime Stream"></iframe>
        </div>
        <div id="investigator-tab" class="iframe-container">
            <iframe src="/investigator" title="EvidenceTrail Investigator"></iframe>
        </div>
    </div>

    <script>
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.iframe-container').forEach(c => c.classList.remove('active'));
                
                tab.classList.add('active');
                const targetId = tab.getAttribute('data-target');
                document.getElementById(targetId).classList.add('active');
            });
        });
    </script>
</body>
</html>
